name: Android CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Download verified ncnn Android Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          NCNN_ZIP="$RUNNER_TEMP/ncnn-20260526-android-vulkan.zip"
          NCNN_ROOT="$RUNNER_TEMP/ncnn-sdk"
          curl --fail --location --retry 3 \
            --output "$NCNN_ZIP" \
            'https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip'
          echo '26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804  '"$NCNN_ZIP" | sha256sum --check --strict
          mkdir -p "$NCNN_ROOT"
          unzip -q "$NCNN_ZIP" -d "$NCNN_ROOT"
          NCNN_CONFIG="$(find "$NCNN_ROOT" -type f -path '*/arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake' -print -quit)"
          test -n "$NCNN_CONFIG"
          NCNN_DIR="$(dirname "$NCNN_CONFIG")"
          echo "NCNN_DIR=$NCNN_DIR" >> "$GITHUB_ENV"
          echo "Using ncnn CMake package: $NCNN_DIR"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build and test compile
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest --stacktrace
