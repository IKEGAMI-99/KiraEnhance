name: Release Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 0.1.0-alpha02"
        required: true
        type: string
      version_code:
        description: "Monotonically increasing Android versionCode"
        required: true
        type: string
      release_notes:
        description: "Release notes shown inside KiraEnhance"
        required: true
        type: string
      dry_run:
        description: "Validate the full release pipeline without production signing secrets or publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      KIRAENHANCE_VERSION_NAME: ${{ inputs.version_name }}
      KIRAENHANCE_VERSION_CODE: ${{ inputs.version_code }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KIRAENHANCE_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version_name: $KIRAENHANCE_VERSION_NAME" >&2
            exit 1
          }
          [[ "$KIRAENHANCE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid version_code: $KIRAENHANCE_VERSION_CODE" >&2
            exit 1
          }
          test -n "$RELEASE_NOTES" || {
            echo "release_notes must not be blank" >&2
            exit 1
          }
          [[ "$DRY_RUN" == "true" || "$DRY_RUN" == "false" ]] || {
            echo "Invalid dry_run value: $DRY_RUN" >&2
            exit 1
          }

      - name: Enforce increasing versionCode
        shell: bash
        run: |
          set -euo pipefail
          LATEST_MANIFEST="$RUNNER_TEMP/latest-update-manifest.json"
          LATEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/update-manifest.json"
          HTTP_STATUS="$(curl -sS -L --retry 2 -o "$LATEST_MANIFEST" -w '%{http_code}' "$LATEST_URL")"

          case "$HTTP_STATUS" in
            200)
              export LATEST_MANIFEST
              python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["LATEST_MANIFEST"]).read_text(encoding="utf-8"))
          previous = int(manifest["versionCode"])
          new = int(os.environ["KIRAENHANCE_VERSION_CODE"])
          if new <= previous:
              raise SystemExit(f"versionCode must increase: latest={previous}, requested={new}")
          print(f"versionCode OK: {previous} -> {new}")
          PY
              ;;
            404)
              echo "No existing update manifest; treating this as the first signed release."
              ;;
            *)
              echo "Could not verify the latest update manifest (HTTP $HTTP_STATUS). Refusing to continue." >&2
              exit 1
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Download verified ncnn Android Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          NCNN_ZIP="$RUNNER_TEMP/ncnn-20260526-android-vulkan.zip"
          NCNN_ROOT="$RUNNER_TEMP/ncnn-sdk"
          curl --fail --location --retry 3 \
            --output "$NCNN_ZIP" \
            'https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip'
          echo '26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804  '"$NCNN_ZIP" | sha256sum --check --strict
          mkdir -p "$NCNN_ROOT"
          unzip -q "$NCNN_ZIP" -d "$NCNN_ROOT"
          NCNN_CONFIG="$(find "$NCNN_ROOT" -type f -path '*/arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake' -print -quit)"
          test -n "$NCNN_CONFIG"
          echo "NCNN_DIR=$(dirname "$NCNN_CONFIG")" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Create throwaway dry-run signing key
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          DRY_RUN_KEYSTORE="$RUNNER_TEMP/kiraenhance-dry-run.jks"
          keytool -genkeypair \
            -keystore "$DRY_RUN_KEYSTORE" \
            -storetype JKS \
            -storepass 'kiraenhance-dry-run' \
            -keypass 'kiraenhance-dry-run' \
            -alias 'kiraenhance-dry-run' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=KiraEnhance Dry Run, O=CI, C=JP' \
            -noprompt
          test -s "$DRY_RUN_KEYSTORE"
          echo "SIGNING_KEYSTORE=$DRY_RUN_KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_ALIAS=kiraenhance-dry-run" >> "$GITHUB_ENV"

      - name: Decode production signing key
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          KIRAENHANCE_KEYSTORE_BASE64: ${{ secrets.KIRAENHANCE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KIRAENHANCE_KEYSTORE_BASE64:-}" || {
            echo "Missing GitHub Secret: KIRAENHANCE_KEYSTORE_BASE64" >&2
            exit 1
          }
          PRODUCTION_KEYSTORE="$RUNNER_TEMP/kiraenhance-release.jks"
          echo "$KIRAENHANCE_KEYSTORE_BASE64" | base64 --decode > "$PRODUCTION_KEYSTORE"
          test -s "$PRODUCTION_KEYSTORE"
          echo "SIGNING_KEYSTORE=$PRODUCTION_KEYSTORE" >> "$GITHUB_ENV"

      - name: Align, sign, and verify APK
        shell: bash
        env:
          KIRAENHANCE_KEYSTORE_PASSWORD: ${{ secrets.KIRAENHANCE_KEYSTORE_PASSWORD }}
          KIRAENHANCE_KEY_ALIAS: ${{ secrets.KIRAENHANCE_KEY_ALIAS }}
          KIRAENHANCE_KEY_PASSWORD: ${{ secrets.KIRAENHANCE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$DRY_RUN" == "true" ]]; then
            APKSIGNER_KS_PASS='kiraenhance-dry-run'
            APKSIGNER_KEY_PASS='kiraenhance-dry-run'
            SIGNING_ALIAS='kiraenhance-dry-run'
            OUTPUT_NAME="KiraEnhance-${KIRAENHANCE_VERSION_NAME}-DRY-RUN.apk"
          else
            test -n "${KIRAENHANCE_KEYSTORE_PASSWORD:-}" || { echo "Missing KIRAENHANCE_KEYSTORE_PASSWORD" >&2; exit 1; }
            test -n "${KIRAENHANCE_KEY_ALIAS:-}" || { echo "Missing KIRAENHANCE_KEY_ALIAS" >&2; exit 1; }
            test -n "${KIRAENHANCE_KEY_PASSWORD:-}" || { echo "Missing KIRAENHANCE_KEY_PASSWORD" >&2; exit 1; }
            APKSIGNER_KS_PASS="$KIRAENHANCE_KEYSTORE_PASSWORD"
            APKSIGNER_KEY_PASS="$KIRAENHANCE_KEY_PASSWORD"
            SIGNING_ALIAS="$KIRAENHANCE_KEY_ALIAS"
            OUTPUT_NAME="KiraEnhance-${KIRAENHANCE_VERSION_NAME}.apk"
          fi

          export APKSIGNER_KS_PASS APKSIGNER_KEY_PASS
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          DIST_DIR="$RUNNER_TEMP/kiraenhance-dist"
          ALIGNED_APK="$DIST_DIR/KiraEnhance-aligned.apk"
          UPDATE_APK="$DIST_DIR/$OUTPUT_NAME"
          mkdir -p "$DIST_DIR"
          test -f "$UNSIGNED_APK"
          test -s "$SIGNING_KEYSTORE"

          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$SIGNING_KEYSTORE" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:APKSIGNER_KS_PASS \
            --key-pass env:APKSIGNER_KEY_PASS \
            --out "$UPDATE_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$UPDATE_APK"

          echo "UPDATE_APK=$UPDATE_APK" >> "$GITHUB_ENV"
          echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"

      - name: Build update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA256="$(sha256sum "$UPDATE_APK" | awk '{print $1}')"
          export APK_SHA256
          export REPOSITORY="${GITHUB_REPOSITORY}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version_name = os.environ["KIRAENHANCE_VERSION_NAME"]
          version_code = int(os.environ["KIRAENHANCE_VERSION_CODE"])
          release_notes = os.environ["RELEASE_NOTES"].strip()
          repository = os.environ["REPOSITORY"]
          apk_sha256 = os.environ["APK_SHA256"]
          apk_name = f"KiraEnhance-{version_name}.apk"
          tag = f"v{version_name}"

          manifest = {
              "versionName": version_name,
              "versionCode": version_code,
              "releaseNotes": release_notes,
              "apkUrl": f"https://github.com/{repository}/releases/download/{tag}/{apk_name}",
              "apkSha256": apk_sha256,
          }
          path = Path(os.environ["DIST_DIR"]) / "update-manifest.json"
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
          printf '%s\n' "$RELEASE_NOTES" > "$DIST_DIR/release-notes.txt"

      - name: Validate generated update manifest
        shell: bash
        run: |
          set -euo pipefail
          export REPOSITORY="${GITHUB_REPOSITORY}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["DIST_DIR"]) / "update-manifest.json"
          apk_path = Path(os.environ["UPDATE_APK"])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          expected_name = os.environ["KIRAENHANCE_VERSION_NAME"]
          expected_code = int(os.environ["KIRAENHANCE_VERSION_CODE"])
          expected_url = (
              f"https://github.com/{os.environ['REPOSITORY']}/releases/download/"
              f"v{expected_name}/KiraEnhance-{expected_name}.apk"
          )
          actual_sha = hashlib.sha256(apk_path.read_bytes()).hexdigest()

          if manifest["versionName"] != expected_name:
              raise SystemExit("Generated manifest versionName mismatch")
          if int(manifest["versionCode"]) != expected_code:
              raise SystemExit("Generated manifest versionCode mismatch")
          if manifest["apkUrl"] != expected_url:
              raise SystemExit("Generated manifest apkUrl mismatch")
          if manifest["apkSha256"].lower() != actual_sha:
              raise SystemExit("Generated manifest SHA-256 mismatch")
          if not str(manifest["releaseNotes"]).strip():
              raise SystemExit("Generated manifest releaseNotes is blank")

          print(f"Manifest validated for {expected_name} ({expected_code})")
          print(f"APK SHA-256: {actual_sha}")
          PY

      - name: Mark dry-run result
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$DIST_DIR/DRY-RUN.txt" <<'EOF'
          This APK was signed with a one-day throwaway CI key.
          It is only for validating the release pipeline.
          Do not publish it and do not use it as a production KiraEnhance update.
          EOF
          echo "Dry run validated successfully. No GitHub Release will be published."

      - name: Publish GitHub Release
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${KIRAENHANCE_VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace signed update assets." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$UPDATE_APK" \
            "$DIST_DIR/update-manifest.json" \
            --target "$GITHUB_SHA" \
            --title "KiraEnhance ${KIRAENHANCE_VERSION_NAME}" \
            --notes-file "$DIST_DIR/release-notes.txt" \
            --latest

      - name: Upload dry-run validation artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: kiraenhance-release-dry-run-${{ inputs.version_name }}
          path: |
            ${{ runner.temp }}/kiraenhance-dist/KiraEnhance-${{ inputs.version_name }}-DRY-RUN.apk
            ${{ runner.temp }}/kiraenhance-dist/update-manifest.json
            ${{ runner.temp }}/kiraenhance-dist/DRY-RUN.txt
          retention-days: 7

      - name: Upload signed release artifacts
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: kiraenhance-release-${{ inputs.version_name }}
          path: |
            ${{ runner.temp }}/kiraenhance-dist/KiraEnhance-${{ inputs.version_name }}.apk
            ${{ runner.temp }}/kiraenhance-dist/update-manifest.json
          retention-days: 30
